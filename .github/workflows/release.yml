name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release-key.jks
          EOF
            echo "Keystore successfully configured."
          else
            echo "::warning::KEYSTORE_BASE64 is not set. Building with debug signing fallback."
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Artifact Name
        id: apk_info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          SOURCE_APK="$OUTPUT_DIR/app-release.apk"
          TARGET_APK="$OUTPUT_DIR/chat-app-$TAG_NAME.apk"
          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$TARGET_APK"
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          else
            echo "::error::Release APK not found at $SOURCE_APK"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_info.outputs.apk_path }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
