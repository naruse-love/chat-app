name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          # 彻底清洗换行符、回车符、空格以及 certutil 可能生成的证书头尾
          CLEAN_BASE64=$(echo "$KEYSTORE_BASE64" | grep -v '^-' | tr -d '\r\n ' || true)
          
          DECODE_SUCCESS=false
          if [ -n "$CLEAN_BASE64" ]; then
            if echo "$CLEAN_BASE64" | base64 -d > android/release-key.jks 2>/dev/null && [ -s android/release-key.jks ]; then
              DECODE_SUCCESS=true
            elif echo "$CLEAN_BASE64" | openssl base64 -d -A > android/release-key.jks 2>/dev/null && [ -s android/release-key.jks ]; then
              DECODE_SUCCESS=true
            fi
          fi

          if [ "$DECODE_SUCCESS" = "true" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release-key.jks
          EOF
            echo "Keystore successfully configured and verified."
          else
            rm -f android/release-key.jks android/key.properties
            echo "::warning::KEYSTORE_BASE64 is empty, invalid, or signing secrets missing. Building APK with debug signing fallback."
          fi

      - name: Extract App Version
        id: app_version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r')
          VERSION_BASE=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f1)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${VERSION_BASE}"
          fi
          echo "pubspec_version=$PUBSPEC_VERSION" >> $GITHUB_OUTPUT
          echo "version_base=$VERSION_BASE" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Detected version: $PUBSPEC_VERSION, Release Tag: $RELEASE_TAG"

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Artifact Name
        id: apk_info
        run: |
          RELEASE_TAG="${{ steps.app_version.outputs.release_tag }}"
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          SOURCE_APK="$OUTPUT_DIR/app-release.apk"
          TARGET_APK="$OUTPUT_DIR/chat-app-$RELEASE_TAG.apk"
          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$TARGET_APK"
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          else
            echo "::error::Release APK not found at $SOURCE_APK"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.release_tag }}
          name: Release ${{ steps.app_version.outputs.release_tag }}
          files: ${{ steps.apk_info.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
